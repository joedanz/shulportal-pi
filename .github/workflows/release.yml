# ABOUTME: Builds the ShulPortal Pi image with pi-gen (in Docker) on an arm64 runner and checks it.
# ABOUTME: A v* tag publishes a GitHub Release with the signed update package; a manual run keeps an artifact.
name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7
      - id: deb
        name: Build the shulportal-pi package
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then ver=${GITHUB_REF_NAME#v}; else ver=0.0.0+dev.${GITHUB_SHA::7}; fi
          # A release tag is vX.Y.Z: a TV only ever installs a version of that form.
          source stage-shulportal/01-shulportal/files/usr/local/lib/shulportal/lib.sh
          if [ "$GITHUB_REF_TYPE" = tag ] && ! is_version "$ver"; then
            echo "::error::release tags look like v1.2.3, not $GITHUB_REF_NAME"; exit 1
          fi
          scripts/build-deb.sh "$ver" out
          deb=shulportal-pi_${ver}_all.deb
          echo "ver=$ver" >> "$GITHUB_OUTPUT"
          echo "deb=$deb" >> "$GITHUB_OUTPUT"
          # Checked again before signing: nothing that runs in between (pi-gen, as root) may swap the package.
          echo "sha=$(sha256sum "out/$deb" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
      - name: Build the image with pi-gen
        run: |
          # pi-gen runs as root before the signing step, so it's pinned; move the pin on purpose, not by accident.
          git clone --branch arm64 https://github.com/RPi-Distro/pi-gen.git pi-gen
          git -C pi-gen checkout --detach c0d2c9f2cffc08bc56850b0a3eb23178f4226e8a
          cp config pi-gen/config
          # pi-gen needs a first-user password to skip the console rename prompt; nobody keeps it.
          pass=$(openssl rand -base64 32)
          echo "::add-mask::$pass"
          printf 'FIRST_USER_PASS=%q\n' "$pass" >> pi-gen/config
          cp -R stage-shulportal pi-gen/
          cp "out/${{ steps.deb.outputs.deb }}" pi-gen/stage-shulportal/01-shulportal/shulportal-pi.deb
          touch pi-gen/stage2/SKIP_IMAGES
          cd pi-gen && ./build-docker.sh
      - id: package
        name: Name, check and describe the image
        run: |
          IMAGE=$(ls pi-gen/deploy/*.img.xz)
          if [ "$GITHUB_REF_TYPE" = tag ]; then version=$GITHUB_REF_NAME; else version=dev-${GITHUB_SHA::7}; fi
          name=shulportal-pi-$version
          mkdir -p out
          cp "$IMAGE" "out/$name.img.xz"
          xz -dk "out/$name.img.xz"
          sudo scripts/check-image.sh "out/$name.img" "${{ steps.deb.outputs.ver }}"
          rm "out/$name.img"
          (cd out && sha256sum "$name.img.xz" > "$name.img.xz.sha256")
          scripts/imager-manifest.sh "out/$name.img.xz" \
            "https://github.com/joedanz/shulportal-pi/releases/download/$version/$name.img.xz" \
            "$(date -u +%F)" > out/shulportal-pi.rpi-imager-manifest
          ls -l out
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - if: github.ref_type == 'tag'
        name: Sign the package for remote updates
        env:
          PI_SIGNING_KEY: ${{ secrets.PI_SIGNING_KEY }}
        run: |
          ver=${{ steps.deb.outputs.ver }}
          deb=out/${{ steps.deb.outputs.deb }}
          echo "${{ steps.deb.outputs.sha }}  $deb" | sha256sum -c -
          key=$(mktemp)
          trap 'rm -f "$key"' EXIT
          (umask 077 && printf '%s\n' "$PI_SIGNING_KEY" > "$key")
          scripts/sign-deb.sh "$deb" "$key"
          # The signature must check out against the public key the TVs carry.
          openssl pkeyutl -verify -pubin -inkey stage-shulportal/01-shulportal/files/usr/local/share/shulportal/release-key.pem \
            -rawin -in "$deb" -sigfile "$deb.sig"
          printf '{"version":"%s"}\n' "$ver" > out/shulportal-pi.json
      - if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=${{ steps.package.outputs.version }}
          deb=${{ steps.deb.outputs.deb }}
          if gh release view "$version" >/dev/null 2>&1; then
            # A re-run replaces the image files, but never a published package: TVs may be mid-download, and the
            # relay's CDN keeps release files for good. A rebuilt package (different bytes) stays out.
            if gh release view "$version" --json assets -q '.assets[].name' | grep -qx "$deb"; then
              rm "out/$deb" "out/$deb.sig" out/shulportal-pi.json
            fi
            gh release upload "$version" out/* --clobber
          else
            gh release create "$version" out/* --title "ShulPortal Pi $version" --generate-notes
          fi
      - if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v7
        with:
          name: shulportal-pi-${{ steps.package.outputs.version }}
          path: out/
          compression-level: 0
