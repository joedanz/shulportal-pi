# ABOUTME: Lints every shell script with shellcheck and runs the bats tests on each push and PR.
# ABOUTME: The install job installs and updates the real package in Debian; the image itself is built by release.yml.
name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    # Debian, like Pi OS (and its mirrors answer when the runner's Ubuntu ones don't).
    container: debian:trixie
    steps:
      - uses: actions/checkout@v7
      - run: apt-get update && apt-get install -y bats shellcheck qrencode jq xz-utils openssl dpkg
      - name: shellcheck
        run: |
          files=$(find stage-shulportal -path '*/files/*' -type f \( -path '*/bin/*' -o -path '*/lib/shulportal/*' -o -path '*/dispatcher.d/*' \); find scripts -type f -name '*.sh' 2>/dev/null; find stage-shulportal -name '*.sh'; echo debian/preinst debian/postinst debian/postrm tests/install/run.sh)
          shellcheck $files
      - run: bats tests/
  install:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - name: Install and update the package in Debian trixie
        run: docker run --rm -v "$PWD":/w -w /w debian:trixie bash tests/install/run.sh
