<!doctype html>
<!-- ABOUTME: What the TV shows while the Pi is still finding a network after boot. -->
<!-- ABOUTME: Replaced by ShulPortal /tv once online, or by the setup page if there is no network. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShulPortal</title>
<link rel="stylesheet" href="file:///usr/local/share/shulportal/tv.css">
<script src="file:///usr/local/share/shulportal/tv.js"></script>
</head>
<body>
<div class="screen">
  <div class="brand"><span class="brand-mark"></span><span class="brand-name">ShulPortal</span></div>
  <main class="body">
    <div class="message">
      <div class="spinner"></div>
      <h1>Connecting to the internet…</h1>
      <p>This takes a moment after the TV turns on.</p>
    </div>
  </main>
</div>
</body>
</html>
