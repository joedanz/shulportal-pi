<!doctype html>
<!-- ABOUTME: What the TV shows while shulportal-update installs a new version of the Pi software. -->
<!-- ABOUTME: The Pi restarts when the install is done, or goes back to its sign if it fails. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>ShulPortal</title>
<link rel="stylesheet" href="file:///usr/local/share/shulportal/tv.css">
<script>
  // ShulPortal says how this TV hangs (shulportal-kiosk adds ?turn=right or ?turn=left); turn the page to match.
  var turn = new URLSearchParams(location.search).get("turn");
  if (turn === "right" || turn === "left") document.documentElement.dataset.turn = turn;
</script>
</head>
<body>
<div class="screen">
  <div class="brand"><span class="brand-mark"></span><span class="brand-name">ShulPortal</span></div>
  <main class="body">
    <div class="message">
      <div class="spinner"></div>
      <h1>Updating the TV</h1>
      <p>Back in a minute or two. Please leave it plugged in.</p>
    </div>
  </main>
</div>
</body>
</html>
